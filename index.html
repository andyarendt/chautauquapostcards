<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Piasa Chautauqua Postcard Gallery</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fefefe;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .gallery-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .gallery-title {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    #fullscreen-container {
      display: inline-block;
      width: 100%;
      text-align: center;
    }
    .postcard-img {
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      border: none;
      margin: 0;
      touch-action: pan-y;
      cursor: pointer;
    }
    .nav-buttons {
      position: absolute;
      bottom: 20px;
      display: flex;
      justify-content: center;
      width: 100%;
    }
    .nav-buttons button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 1rem;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
    .nav-buttons button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="gallery-container">
    <div class="gallery-title">New Piasa Chautauqua Postcard Gallery</div>
    <div id="fullscreen-container">
      <img id="postcard" class="postcard-img" src="images/1.jpg" alt="Postcard" onclick="toggleFullscreen(event)" />
    </div>
    <div class="nav-buttons">
      <button onclick="prevImage()">Previous</button>
      <button onclick="nextImage()">Next</button>
    </div>
  </div>

  <script>
    const imageCount = 20;
    let currentIndex = 1;

    function updateImage() {
      document.getElementById('postcard').src = `images/${currentIndex}.jpg`;
    }

    function nextImage() {
      currentIndex = (currentIndex % imageCount) + 1;
      updateImage();
    }

    function prevImage() {
      currentIndex = (currentIndex - 2 + imageCount) % imageCount + 1;
      updateImage();
    }

    // Swipe support
    let touchStartX = 0;
    let touchEndX = 0;

    function handleGesture() {
      if (touchEndX < touchStartX - 30) nextImage();
      if (touchEndX > touchStartX + 30) prevImage();
    }

    const postcard = document.getElementById('postcard');
    postcard.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    });
    postcard.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleGesture();
    });

    // Mobile-friendly fullscreen toggle
    function toggleFullscreen(e) {
      const container = e.currentTarget;
      const request = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;

      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        request.call(container);
      } else {
        exit.call(document);
      }
    }
  </script>
</body>
</html>
