<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Postcard Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f9f9f9;
    }

    header {
      text-align: center;
      padding: 30px 20px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.03);
    }

    #viewer {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 10px;
      box-sizing: border-box;
    }

    #viewer.active {
      display: flex;
    }

    .viewer-image {
      text-align: center;
      max-width: 100%;
      max-height: 100%;
    }

    .viewer-image img {
      width: 100%;
      height: auto;
      max-height: 80vh;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
      touch-action: none;
      transform-origin: center center;
      transition: transform 0.2s ease;
    }

    .caption {
      margin-top: 8px;
      font-size: 1.2rem;
      text-transform: none;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.2rem;
      background: none;
      border: 2px solid white;
      color: white;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        padding: 10px;
      }

      .viewer-image img {
        width: 100%;
        height: auto;
        max-height: 70vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>New Piasa Chautauqua Postcard Collection</h1>
  </header>

  <div class="gallery" id="gallery"></div>

  <div id="viewer" onclick="maybeCloseViewer(event)">
    <button class="close-btn" onclick="closeViewer()">Close</button>
    <div class="viewer-image">
      <img id="postcardImage" src="" alt="Postcard View">
      <div class="caption" id="imageCaption"></div>
    </div>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const viewer = document.getElementById('viewer');
    const postcardImage = document.getElementById('postcardImage');
    const caption = document.getElementById('imageCaption');

    let currentIndex = 1;
    const maxPostcards = 12;
    let isFront = true;

    for (let i = 1; i <= maxPostcards; i++) {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = `images/${i}-front.jpg`;
      img.alt = `Postcard ${i} Front`;
      img.onclick = () => openViewer(i);
      div.appendChild(img);
      gallery.appendChild(div);
    }

    function openViewer(index) {
      currentIndex = index;
      isFront = true;
      viewer.classList.add('active');
      updateViewer();
    }

    function closeViewer() {
      viewer.classList.remove('active');
      resetZoom();
    }

    function maybeCloseViewer(event) {
      if (event.target === viewer) {
        closeViewer();
      }
    }

    function updateViewer() {
      const side = isFront ? 'front' : 'back';
      postcardImage.src = `images/${currentIndex}-${side}.jpg`;
      caption.textContent = isFront
        ? 'swipe right/use arrow key to see back'
        : 'swipe left/use arrow key to see front';
      resetZoom();
    }

    document.addEventListener('keydown', function(event) {
      if (!viewer.classList.contains('active')) return;
      if (event.key === 'Escape') closeViewer();
      else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        isFront = !isFront;
        updateViewer();
      }
    });

    // Swipe gesture support
    let touchStartX = 0, touchEndX = 0;

    viewer.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchStartX = e.changedTouches[0].screenX;
      }
    }, false);

    viewer.addEventListener('touchend', e => {
      if (e.changedTouches.length === 1) {
        touchEndX = e.changedTouches[0].screenX;
        handleGesture();
      }
    }, false);

    function handleGesture() {
      if (!viewer.classList.contains('active')) return;
      if (touchEndX < touchStartX - 50) {
        isFront = false;
        updateViewer();
      } else if (touchEndX > touchStartX + 50) {
        isFront = true;
        updateViewer();
      }
    }

    // Zoom & pan support
    let initialDistance = 0, initialScale = 1, currentScale = 1;
    let isDragging = false, startX = 0, startY = 0, translateX = 0, translateY = 0;

    postcardImage.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        initialDistance = getDistance(e.touches[0], e.touches[1]);
        initialScale = currentScale;
      } else if (e.touches.length === 1 && currentScale > 1) {
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      }
    }, { passive: false });

    postcardImage.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const newDistance = getDistance(e.touches[0], e.touches[1]);
        const scale = newDistance / initialDistance;
        currentScale = Math.min(Math.max(1, initialScale * scale), 4);
        updateTransform();
      } else if (e.touches.length === 1 && currentScale > 1) {
        e.preventDefault();
        const deltaX = e.touches[0].clientX - lastTouchX;
        const deltaY = e.touches[0].clientY - lastTouchY;
        translateX += deltaX;
        translateY += deltaY;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        updateTransform();
      }
    }, { passive: false });

    postcardImage.addEventListener('mousedown', e => {
      if (currentScale > 1) {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        postcardImage.style.cursor = 'grabbing';
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      postcardImage.style.cursor = 'default';
    });

    document.addEventListener('mousemove', e => {
      if (isDragging) {
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      }
    });

    function getDistance(t1, t2) {
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function updateTransform() {
      postcardImage.style.transform = `scale(${currentScale}) translate(${translateX / currentScale}px, ${translateY / currentScale}px)`;
    }

    function resetZoom() {
      currentScale = 1;
      translateX = 0;
      translateY = 0;
      postcardImage.style.transform = 'scale(1) translate(0, 0)';
    }
  </script>
</body>
</html>
