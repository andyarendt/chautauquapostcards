<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Piasa Chautauqua Postcard Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fefefe;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .gallery-container {
      text-align: center;
    }
    .gallery-title {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .postcard-img {
      max-width: 90vw;
      max-height: 70vh;
      border: 4px solid #333;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 1rem;
      touch-action: pan-y;
      cursor: pointer;
    }
    .nav-buttons button, .fullscreen-btn {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 1rem;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
    .nav-buttons button:hover, .fullscreen-btn:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="gallery-container">
    <div class="gallery-title">New Piasa Chautauqua Postcard Gallery</div>
    <img id="postcard" class="postcard-img" src="images/1.jpg" alt="Postcard" onclick="toggleFullscreen()" />
    <div class="nav-buttons">
      <button onclick="prevImage()">Previous</button>
      <button onclick="nextImage()">Next</button>
      <button class="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
  </div>

  <script>
    const imageCount = 20; // change this to match your total number of postcards
    let currentIndex = 1;

    function updateImage() {
      const img = document.getElementById('postcard');
      img.src = `images/${currentIndex}.jpg`;
    }

    function nextImage() {
      currentIndex = (currentIndex % imageCount) + 1;
      updateImage();
    }

    function prevImage() {
      currentIndex = (currentIndex - 2 + imageCount) % imageCount + 1;
      updateImage();
    }

    // Swipe support
    let touchStartX = 0;
    let touchEndX = 0;

    function handleGesture() {
      if (touchEndX < touchStartX - 30) nextImage();
      if (touchEndX > touchStartX + 30) prevImage();
    }

    document.getElementById('postcard').addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    });

    document.getElementById('postcard').addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleGesture();
    });

    // Fullscreen support
    function toggleFullscreen() {
      const elem = document.getElementById('postcard');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          alert(`Error attempting to enable fullscreen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
