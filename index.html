<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Postcard Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      --bg:#f9f9f9; --text:#333; --muted:#666; --shadow:0 2px 8px rgba(0,0,0,.1);
      --btn:#444; --btnActive:#111; --btnText:#fff; --accent:#999;
    }
    *{box-sizing:border-box}
    body{font-family:sans-serif;margin:0;background:var(--bg)}
    header{ text-align:center; padding:28px 16px 8px; }
    header h1{ margin:0; font-size:2rem; color:var(--text); }
    header p{ margin:10px 0 14px; font-size:1rem; color:var(--muted); }

    /* Toggle */
    .toggle{ display:inline-flex; gap:6px; background:#eee; padding:6px; border-radius:999px; box-shadow:var(--shadow); }
    .toggle button{ border:0; background:transparent; padding:10px 16px; border-radius:999px; cursor:pointer; font-weight:600; color:#333; }
    .toggle button[aria-pressed="true"]{ background:#fff; box-shadow:var(--shadow); }

    .gallery{ display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:20px; padding:20px; }
    .gallery-item img{ width:100%; height:auto; border-radius:12px; cursor:pointer; box-shadow:var(--shadow); transition: transform .2s ease; }
    .gallery-item img:hover{ transform: scale(1.03); }

    /* Viewer */
    #viewer{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); color:#fff; z-index:999; padding:10px; }
    #viewer.active{ display:flex; flex-direction:column; justify-content:center; align-items:center; }
    .viewer-image{ position:relative; text-align:center; max-width:100%; max-height:100%; }
    .viewer-image img{ width:100%; height:auto; max-height:80vh; border-radius:10px; display:block; margin:0 auto; }
    .viewer-nav{ display:flex; align-items:center; justify-content:center; gap:20px; margin-top:20px; }
    .toggle-btn, .nav-btn{ font-size:1rem; padding:10px 20px; background:var(--btn); color:var(--btnText); border:none; border-radius:8px; cursor:pointer; }
    .close-btn{ position:absolute; top:20px; right:20px; font-size:1.1rem; background:none; border:2px solid #fff; color:#fff; padding:4px 10px; cursor:pointer; border-radius:6px; }

    @media (max-width:600px){
      .gallery{ grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); padding:10px; }
      .viewer-image img{ max-height:70vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>New Piasa Chautauqua Postcard Collection</h1>
    <p>Click images to enlarge</p>
    <div class="toggle" role="tablist" aria-label="Collection toggle">
      <button id="tab-bw" role="tab" aria-selected="true" aria-pressed="true">Black & White</button>
      <button id="tab-color" role="tab" aria-selected="false" aria-pressed="false">Color</button>
    </div>
  </header>

  <div class="gallery" id="gallery"></div>

  <div id="viewer" onclick="maybeCloseViewer(event)">
    <button class="close-btn" onclick="closeViewer()">Close</button>
    <div class="viewer-image">
      <img id="postcardImage" src="" alt="Postcard View" />
      <div class="viewer-nav">
        <button class="nav-btn" onclick="prevPostcard()" aria-label="Previous">←</button>
        <button class="toggle-btn" onclick="toggleSide()" aria-label="Flip front/back">Flip</button>
        <button class="nav-btn" onclick="nextPostcard()" aria-label="Next">→</button>
      </div>
    </div>
  </div>

    let currentIndex = 0;
    let isFront = true;
    let currentSet = 'bw';
    const imageCache = {};

    const tabBW = document.getElementById('tab-bw');
    const tabColor = document.getElementById('tab-color');

    tabBW.addEventListener('click', () => switchSet('bw'));
    tabColor.addEventListener('click', () => switchSet('color'));

    function switchSet(set){
      if(set === currentSet) return;
      currentSet = set;
      const isBW = set === 'bw';
      tabBW.setAttribute('aria-selected', isBW);
      tabBW.setAttribute('aria-pressed', isBW);
      tabColor.setAttribute('aria-selected', !isBW);
      tabColor.setAttribute('aria-pressed', !isBW);
      closeViewer();
      renderGallery();
      if(getCards().length === 0){
        gallery.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#666;margin:20px 0;">No color postcards yet. Check back soon!</p>`;
      }
    }

    function getCards(){
      return currentSet === 'bw' ? bwPostcards : colorPostcards;
    }

    function renderGallery(){
      gallery.innerHTML = '';
      getCards().forEach((card, index) => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        const img = document.createElement('img');
        img.src = card.front;
        img.alt = `Postcard ${index + 1} Front`;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onclick = () => openViewer(index);
        div.appendChild(img);
        gallery.appendChild(div);
      });
    }

    function openViewer(index){
      currentIndex = index;
      isFront = true;
      viewer.classList.add('active');
      updateViewer();
    }

    function closeViewer(){ viewer.classList.remove('active'); }

    function maybeCloseViewer(event){ if(event.target === viewer){ closeViewer(); } }

    function updateViewer(){
      const cards = getCards();
      if(cards.length === 0) return;
      const side = isFront ? 'front' : 'back';
      const cached = imageCache[`${currentSet}-${currentIndex}-${side}`];
      const src = cached ? cached.src : cards[currentIndex][side];
      postcardImage.src = src;
    }

    function toggleSide(){ isFront = !isFront; updateViewer(); }

    function prevPostcard(){
      const cards = getCards();
      if(cards.length === 0) return;
      currentIndex = currentIndex > 0 ? currentIndex - 1 : cards.length - 1;
      isFront = true; updateViewer();
    }
    function nextPostcard(){
      const cards = getCards();
      if(cards.length === 0) return;
      currentIndex = currentIndex < cards.length - 1 ? currentIndex + 1 : 0;
      isFront = true; updateViewer();
    }

    document.addEventListener('keydown', function(event){
      if(!viewer.classList.contains('active')) return;
      if(event.key === 'Escape') closeViewer();
      if(event.key === 'ArrowLeft') prevPostcard();
      if(event.key === 'ArrowRight') nextPostcard();
      if(event.code === 'Space'){ event.preventDefault(); toggleSide(); }
    });

    renderGallery();
  </script>

</html>
