
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Postcard Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f9f9f9;
    }

    header {
      text-align: center;
      padding: 30px 20px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: #333;
    }

    header p {
      margin-top: 10px;
      font-size: 1rem;
      color: #666;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.03);
    }

    #viewer {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 10px;
      box-sizing: border-box;
    }

    #viewer.active {
      display: flex;
    }

    .viewer-image {
      position: relative;
      text-align: center;
      max-width: 100%;
      max-height: 100%;
    }

    .viewer-image img {
      width: 100%;
      height: auto;
      max-height: 80vh;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
    }

    .viewer-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .toggle-btn, .nav-btn {
      font-size: 1rem;
      padding: 10px 20px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.2rem;
      background: none;
      border: 2px solid white;
      color: white;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        padding: 10px;
      }

      .viewer-image img {
        width: 100%;
        height: auto;
        max-height: 70vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>New Piasa Chautauqua Postcard Collection</h1>
    <p>Click images to enlarge</p>
  </header>

  <div class="gallery" id="gallery"></div>

  <div id="viewer" onclick="maybeCloseViewer(event)">
    <button class="close-btn" onclick="closeViewer()">Close</button>
    <div class="viewer-image">
      <img id="postcardImage" src="" alt="Postcard View">
      <div class="viewer-nav">
        <button class="nav-btn" onclick="prevPostcard()">←</button>
        <button class="toggle-btn" onclick="toggleSide()">Flip</button>
        <button class="nav-btn" onclick="nextPostcard()">→</button>
      </div>
    </div>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const viewer = document.getElementById('viewer');
    const postcardImage = document.getElementById('postcardImage');

    const postcards = [

      { front: 'images/46-front.jpg', back: 'images/46-back.jpg' },
      { front: 'images/47-front.jpg', back: 'images/47-back.jpg' },
      { front: 'images/48-front.jpg', back: 'images/48-back.jpg' },
      { front: 'images/49-front.jpg', back: 'images/49-back.jpg' },
      { front: 'images/50-front.jpg', back: 'images/50-back.jpg' },
      { front: 'images/51-front.jpg', back: 'images/51-back.jpg' },
      { front: 'images/52-front.jpg', back: 'images/52-back.jpg' },
      { front: 'images/54-front.jpg', back: 'images/54-back.jpg' }
    ];

    let currentIndex = 0;
    let isFront = true;
    const imageCache = {};

    postcards.forEach((card, index) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = card.front;
      img.alt = `Postcard ${index + 1} Front`;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onclick = () => openViewer(index);
      div.appendChild(img);
      gallery.appendChild(div);

      });

    function openViewer(index) {
      currentIndex = index;
      isFront = true;
      viewer.classList.add('active');
      updateViewer();
    }

    function closeViewer() {
      viewer.classList.remove('active');
    }

    function maybeCloseViewer(event) {
      if (event.target === viewer) {
        closeViewer();
      }
    }

    function updateViewer() {
      const side = isFront ? 'front' : 'back';
      const cachedImage = imageCache[`${currentIndex}-${side}`];
      postcardImage.src = cachedImage ? cachedImage.src : postcards[currentIndex][side];
    }

    function toggleSide() {
      isFront = !isFront;
      updateViewer();
    }

    function prevPostcard() {
      currentIndex = currentIndex > 0 ? currentIndex - 1 : postcards.length - 1;
      isFront = true;
      updateViewer();
    }

    function nextPostcard() {
      currentIndex = currentIndex < postcards.length - 1 ? currentIndex + 1 : 0;
      isFront = true;
      updateViewer();
    }

    document.addEventListener('keydown', function(event) {
      if (!viewer.classList.contains('active')) return;
      if (event.key === 'Escape') closeViewer();
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') toggleSide();
    });
  </script>
</body>
</html>
